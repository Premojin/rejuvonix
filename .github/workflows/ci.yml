name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run governance:validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm audit --audit-level=high
      - run: npm test

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: trufflesecurity/trufflehog@v3.90.8
        with:
          path: ./
          extra_args: --only-verified
      - name: IaC scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          trivyignores: .trivyignore
          severity: HIGH,CRITICAL
          exit-code: 1
      - name: Build container
        run: docker build --tag rejuvonix:${{ github.sha }} .
      - name: Container scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rejuvonix:${{ github.sha }}
          scan-type: image
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - name: Validate bootstrap Terraform
        working-directory: infra/bootstrap
        run: |
          terraform fmt -check -recursive ..
          terraform init -backend=false
          terraform validate
      - name: Validate staging Terraform
        working-directory: infra/environments/staging
        run: |
          terraform fmt -check -recursive ../..
          terraform init -backend=false
          terraform validate

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
