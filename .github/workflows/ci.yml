name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: ./node_modules/.bin/tsc --noEmit
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: node --test tests/rendered-html.test.mjs
